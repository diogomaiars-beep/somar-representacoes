<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Somar Representações | Administração</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
</head>
<body class="admin-page">
<header class="topbar"><div class="container nav">
  <a class="brand" href="index.html"><span class="brand-mark">S</span><span>Somar <b>Representações</b></span></a>
  <a class="btn btn-outline" href="index.html">Ver site</a>
</div></header>

<main class="container admin-wrap">
  <section id="loginBox" class="panel auth-panel">
    <span class="eyebrow">ÁREA ADMINISTRATIVA</span>
    <h1>Gerenciar catálogos</h1>
    <p>Entre para publicar, editar, substituir ou excluir catálogos.</p>
    <form id="loginForm">
      <label>E-mail<input id="email" type="email" required autocomplete="username"></label>
      <label>Senha<input id="password" type="password" required autocomplete="current-password"></label>
      <button class="btn" type="submit">Entrar</button>
    </form>
    <div id="loginMsg" class="status"></div>
  </section>

  <section id="dashboard" hidden>
    <div class="admin-head">
      <div><span class="eyebrow">PAINEL</span><h1>Meus catálogos</h1></div>
      <button id="logout" class="btn btn-outline">Sair</button>
    </div>
    <div id="adminMsg" class="status"></div>
    <div class="admin-grid">
      <form id="catalogForm" class="panel">
        <h2 id="formTitle">Novo catálogo</h2>
        <input type="hidden" id="catalogId">
        <input type="hidden" id="oldPdfPath">
        <input type="hidden" id="oldCoverPath">
        <label>Nome do catálogo<input id="name" required placeholder="Ex.: Catálogo de Utilidades 2026"></label>
        <label>Marca<input id="brand" required placeholder="Nome da marca"></label>
        <label>Categoria
          <select id="category" required>
            <option>Cama, Mesa e Banho</option><option>Brinquedos</option><option>Utilidades</option><option>Material Escolar</option><option>Sazonais</option>
          </select>
        </label>
        <label>Descrição<textarea id="description" rows="3" placeholder="Descrição curta para aparecer no site."></textarea></label>
        <label>PDF do catálogo <input id="pdf" type="file" accept="application/pdf"></label>
        <label>Capa (opcional) <input id="cover" type="file" accept="image/png,image/jpeg,image/webp"></label>
        <label class="check"><input id="published" type="checkbox" checked> Publicar no site</label>
        <div class="form-actions"><button class="btn" type="submit">Salvar catálogo</button><button class="btn btn-outline" id="cancelEdit" type="button">Limpar</button></div>
      </form>
      <div class="panel">
        <h2>Catálogos cadastrados</h2>
        <div id="adminList" class="admin-list"></div>
      </div>
    </div>
  </section>
</main>
<script src="admin.js"></script>
</body>
</html>
